# ==== Cấu hình kết nối SQL Server (SQL Server Authentication) ====
# Nếu SQL Server của bạn là instance tên (vd SQLEXPRESS), đổi URL thành:
#   jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=CompanyDB;encrypt=true;trustServerCertificate=true
# (cần bật dịch vụ "SQL Server Browser")
db.url=jdbc:sqlserver://localhost:1433;databaseName=CompanyDB;encrypt=true;trustServerCertificate=true
db.user=sa
db.password=123456
